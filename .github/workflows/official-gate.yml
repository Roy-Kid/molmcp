# The repository's single required GitHub check.
#
# GitHub matches a required check on a job's `name:`, so `official/gate` on the
# pull-request job below is the one line that makes the check exist. What it
# runs is `uv run molmcp gate` — the same sentence `.pre-commit-config.yaml`
# hands the `official-gate` hook as its `entry:`, character for character.
# `uv sync --extra dev` is the prior Install step and is never folded into that
# token, and no `run:` here holds a `${{ }}` expression: what an expression
# expands to on a runner is not what parity compared. The `${{ }}` in
# `concurrency:` is deliberate — expressions are legal everywhere but a `run:`.
#
# Lint and tests are not here. They stay on ci.yml's OS/Python matrix; running
# them again under this name would report one verdict twice, more slowly.
name: Official Gate

on:
  pull_request:
    branches: [master, dev]
  schedule:
    # Monday 06:00 UTC. The timer is not a knob: it re-checks that the wiring
    # is still intact during a week with no pull request.
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: official-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  official-gate:
    name: official/gate
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
          enable-cache: true
      - name: Install
        run: uv sync --extra dev
      - name: Gate
        run: uv run molmcp gate

  official-gate-schedule:
    name: official/gate (schedule)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
          enable-cache: true
      - name: Install
        run: uv sync --extra dev
      - name: Gate
        run: uv run molmcp gate
