# Managed by prek: `prek install`
# CI parity, pair 1: ci-lint / ci-test are the same shell commands as
# .github/workflows/ci.yml's Lint / Test steps (no tox wrapper).
# CI parity, pair 2: official-gate's entry: is the same literal as the
# official-gate job's run: in .github/workflows/official-gate.yml — bare, so
# that the two are equal character for character.
# tox remains in [project.optional-dependencies] dev for optional local isolation.

default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ['--unsafe']
      - id: check-added-large-files
        args: ['--maxkb=1024']
      - id: check-merge-conflict
      - id: mixed-line-ending
      - id: check-toml
      - id: check-json

  - repo: local
    hooks:
      - id: ci-lint
        name: "CI lint (same as ci.yml)"
        entry: bash -c 'uv sync --extra dev && uv run ruff check src tests && uv run ruff format --check src tests'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]

      - id: ci-test
        name: "CI test (same as ci.yml)"
        entry: bash -c 'uv sync --extra dev && uv run pytest -v'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # The bare literal, on purpose: not `entry: uv` plus `args:`, and not
      # the `bash -c 'uv sync && …'` wrapper the two hooks above carry. It has
      # to equal the official-gate job's `run:` as a string, and a wrapper is
      # a different string. Push tier only — the commit tier stays fast.
      - id: official-gate
        name: "official/gate (same as official-gate.yml)"
        entry: uv run molmcp gate
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
