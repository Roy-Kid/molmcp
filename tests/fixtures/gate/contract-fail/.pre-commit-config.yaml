# Fixture: the planted breakage, and the only difference from `wired/`.
#
# The official-gate hook wraps the call in `bash -c 'uv sync --extra dev && …'`,
# so its `entry:` no longer equals the pull-request job's literal
# `run: uv run molmcp gate`. Everything else in this tree is the legal wiring,
# which is what makes the reported failure attributable to this line.

default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ['--unsafe']

  - repo: local
    hooks:
      - id: ci-lint
        name: "CI lint (same as ci.yml)"
        entry: bash -c 'uv sync --extra dev && uv run ruff check src tests && uv run ruff format --check src tests'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]

      - id: ci-test
        name: "CI test (same as ci.yml)"
        entry: bash -c 'uv sync --extra dev && uv run pytest -v'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: official-gate
        name: "official/gate (same as official-gate.yml)"
        entry: bash -c 'uv sync --extra dev && uv run molmcp gate'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
