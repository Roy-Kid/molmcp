# Fixture: the workflow half of `contract-fail/` is legal on purpose.
#
# It is character-for-character the `wired/` workflow. The planted breakage
# lives in this tree's `.pre-commit-config.yaml`, whose official-gate
# `entry:` no longer equals the pull-request job's `run:` below — so the
# failure run_gate reports can only be that one disagreement.
name: Official Gate

on:
  pull_request:
    branches: [master, dev]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: official-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  official-gate:
    name: official/gate
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
          enable-cache: true
      - name: Install
        run: uv sync --extra dev
      - name: Gate
        run: uv run molmcp gate

  official-gate-schedule:
    name: official/gate (schedule)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
          enable-cache: true
      - name: Install
        run: uv sync --extra dev
      - name: Gate
        run: uv run molmcp gate
