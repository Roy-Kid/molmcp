# Fixture: a legal wiring. run_gate(root=<this tree>) must return ok.
#
# Both jobs run the one literal `uv run molmcp gate`. `uv sync --extra dev`
# is the prior Install step and is not the compared token. The `${{ }}` in
# `concurrency:` is deliberate: expressions are legal everywhere except in a
# `run:`, which is the only place parity reads.
name: Official Gate

on:
  pull_request:
    branches: [master, dev]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: official-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  official-gate:
    name: official/gate
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
          enable-cache: true
      - name: Install
        run: uv sync --extra dev
      - name: Gate
        run: uv run molmcp gate

  official-gate-schedule:
    name: official/gate (schedule)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
          enable-cache: true
      - name: Install
        run: uv sync --extra dev
      - name: Gate
        run: uv run molmcp gate
