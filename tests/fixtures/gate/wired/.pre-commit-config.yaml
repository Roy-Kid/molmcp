# Fixture: the pre-commit half of a legal wiring.
#
# `official-gate` carries the bare literal as its `entry:` — not `entry: uv`
# plus `args:`, and not a `bash -c 'uv sync && …'` wrapper — so it equals the
# pull-request job's `run:` character for character. It is a pre-push hook;
# the commit stage still holds only the existing ci-lint.

default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ['--unsafe']

  - repo: local
    hooks:
      - id: ci-lint
        name: "CI lint (same as ci.yml)"
        entry: bash -c 'uv sync --extra dev && uv run ruff check src tests && uv run ruff format --check src tests'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]

      - id: ci-test
        name: "CI test (same as ci.yml)"
        entry: bash -c 'uv sync --extra dev && uv run pytest -v'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: official-gate
        name: "official/gate (same as official-gate.yml)"
        entry: uv run molmcp gate
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
